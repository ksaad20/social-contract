name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          validate-wrappers: false

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository:"
          pwd

          echo "Project files:"
          find . -maxdepth 3 -type f | sort

          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Verify Android namespace configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking AndroidManifest.xml..."

          if grep -Eq '<manifest[^>]*[[:space:]]package[[:space:]]*=' \
            app/src/main/AndroidManifest.xml; then

            echo "::error::AndroidManifest.xml contains package=."
            echo "Remove package= from the manifest."
            exit 1
          fi

          echo "Manifest package attribute correctly absent."

          echo "Checking Gradle namespace..."

          grep -Rni \
            'namespace[[:space:]]*=' \
            app/build.gradle.kts \
            || {
              echo "::error::No namespace declaration found in app/build.gradle.kts"
              exit 1
            }

      - name: Verify Kotlin sources
        shell: bash
        run: |
          set -euo pipefail

          echo "Kotlin source files:"

          find app/src/main \
            -type f \
            -name "*.kt" \
            -print \
            | sort

          test -n "$(
            find app/src/main \
              -type f \
              -name "*.kt" \
              -print \
              -quit
          )"

      - name: Verify Gradle
        shell: bash
        run: |
          set -euo pipefail

          gradle --version

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for APK..."

          find . \
            -type f \
            -name "*.apk" \
            -print \
            | sort

          test -n "$(
            find app/build/outputs/apk/debug \
              -type f \
              -name "*.apk" \
              -print \
              -quit
          )"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find app/build/outputs/apk/debug \
              -type f \
              -name "*.apk" \
              -print \
              -quit
          )"

          test -f "${APK}"
          test -s "${APK}"

          echo "APK:"
          echo "${APK}"

          ls -lh "${APK}"

          APKSIGNER="$(
            find "${ANDROID_HOME}/build-tools" \
              -type f \
              -name apksigner \
              -print \
              | sort \
              | tail -n 1
          )"

          test -x "${APKSIGNER}"

          "${APKSIGNER}" verify \
            --verbose \
            "${APK}"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v5
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
