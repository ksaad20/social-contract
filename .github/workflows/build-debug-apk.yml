name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK Without Gradle
    runs-on: ubuntu-latest

    env:
      ANDROID_API: "35"
      BUILD_TOOLS: "35.0.0"
      MIN_SDK: "23"
      PACKAGE_NAME: "com.example.socialcontract"

      # Kotlin and Compose compiler must match.
      KOTLIN_VERSION: "2.1.21"

      # Compose libraries.
      COMPOSE_BOM: "2025.05.00"
      ACTIVITY_COMPOSE: "1.10.1"
      MATERIAL3: "1.3.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euxo pipefail

          SDK="${ANDROID_HOME}"
          BT="${SDK}/build-tools/${BUILD_TOOLS}"

          test -f "${SDK}/platforms/android-${ANDROID_API}/android.jar"
          test -x "${BT}/aapt2"
          test -x "${BT}/d8"
          test -x "${BT}/zipalign"
          test -x "${BT}/apksigner"

          java -version

      - name: Install Kotlin compiler
        shell: bash
        run: |
          set -euxo pipefail

          URL="https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            "${URL}" \
            --output kotlin.zip

          rm -rf kotlin-dist

          mkdir -p kotlin-dist

          unzip -q kotlin.zip -d kotlin-dist

          KOTLINC="$(find kotlin-dist \
            -type f \
            -name kotlinc \
            -print \
            -quit)"

          test -n "${KOTLINC}"

          chmod +x "${KOTLINC}"

          KOTLIN_BIN="$(dirname "${KOTLINC}")"

          echo "${KOTLIN_BIN}" >> "${GITHUB_PATH}"

          "${KOTLINC}" -version

      - name: Prepare build directories
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf native-build

          mkdir -p \
            native-build/compiled-res \
            native-build/generated \
            native-build/classes \
            native-build/dex \
            native-build/apk \
            native-build/libs \
            native-build/m2

      - name: Generate native manifest
        shell: bash
        run: |
          set -euxo pipefail

          python3 - "${PACKAGE_NAME}" <<'PY'
          from pathlib import Path
          import re
          import sys

          package_name = sys.argv[1]

          source = Path("app/src/main/AndroidManifest.xml")
          target = Path("native-build/AndroidManifest.xml")

          if not source.is_file():
              raise SystemExit("AndroidManifest.xml not found")

          text = source.read_text(encoding="utf-8")

          text = re.sub(
              r'\s+package\s*=\s*"[^"]*"',
              "",
              text,
              count=1,
          )

          text = re.sub(
              r"<manifest\b",
              f'<manifest package="{package_name}"',
              text,
              count=1,
          )

          target.write_text(text, encoding="utf-8")
          PY

          grep -q \
            "package=\"${PACKAGE_NAME}\"" \
            native-build/AndroidManifest.xml

      - name: Compile Android resources
        shell: bash
        run: |
          set -euxo pipefail

          AAPT2="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt2"

          test -d app/src/main/res

          while IFS= read -r -d '' file; do
            "${AAPT2}" compile \
              --legacy \
              -o native-build/compiled-res \
              "${file}"
          done < <(
            find app/src/main/res \
              -type f \
              -print0
          )

      - name: Link Android resources
        shell: bash
        run: |
          set -euxo pipefail

          AAPT2="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt2"
          ANDROID_JAR="${ANDROID_HOME}/platforms/android-${ANDROID_API}/android.jar"

          mapfile -t FLAT < <(
            find native-build/compiled-res \
              -type f \
              -name "*.flat"
          )

          test "${#FLAT[@]}" -gt 0

          "${AAPT2}" link \
            -o native-build/resources.apk \
            --manifest native-build/AndroidManifest.xml \
            -I "${ANDROID_JAR}" \
            --java native-build/generated \
            --auto-add-overlay \
            "${FLAT[@]}"

          test -f native-build/resources.apk

      # ------------------------------------------------------------------
      # Maven dependency resolver.
      #
      # This uses Maven only as a dependency downloader/resolver.
      # It does NOT invoke Gradle and does not require gradlew,
      # gradle-wrapper.jar, or any Gradle action.
      # ------------------------------------------------------------------

      - name: Install Maven
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y maven

          mvn --version

      - name: Create native dependency descriptor
        shell: bash
        run: |
          set -euxo pipefail

          cat > native-build/pom.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0
                   https://maven.apache.org/xsd/maven-4.0.0.xsd">

            <modelVersion>4.0.0</modelVersion>

            <groupId>com.socialcontract</groupId>
            <artifactId>native-build</artifactId>
            <version>1.0.0</version>

            <repositories>

              <repository>
                <id>google</id>
                <url>https://dl.google.com/dl/android/maven2/</url>
              </repository>

              <repository>
                <id>central</id>
                <url>https://repo1.maven.org/maven2/</url>
              </repository>

            </repositories>

            <dependencies>

              <!-- AndroidX Activity -->
              <dependency>
                <groupId>androidx.activity</groupId>
                <artifactId>activity-compose</artifactId>
                <version>${ACTIVITY_COMPOSE}</version>
              </dependency>

              <!-- Compose -->
              <dependency>
                <groupId>androidx.compose.runtime</groupId>
                <artifactId>runtime</artifactId>
                <version>1.8.3</version>
              </dependency>

              <dependency>
                <groupId>androidx.compose.ui</groupId>
                <artifactId>ui</artifactId>
                <version>1.8.3</version>
              </dependency>

              <dependency>
                <groupId>androidx.compose.ui</groupId>
                <artifactId>ui-tooling-preview</artifactId>
                <version>1.8.3</version>
              </dependency>

              <dependency>
                <groupId>androidx.compose.foundation</groupId>
                <artifactId>foundation</artifactId>
                <version>1.8.3</version>
              </dependency>

              <dependency>
                <groupId>androidx.compose.material3</groupId>
                <artifactId>material3</artifactId>
                <version>${MATERIAL3}</version>
              </dependency>

              <!-- Kotlin standard library -->
              <dependency>
                <groupId>org.jetbrains.kotlin</groupId>
                <artifactId>kotlin-stdlib</artifactId>
                <version>${KOTLIN_VERSION}</version>
              </dependency>

              <!-- Compose compiler plugin -->
              <dependency>
                <groupId>org.jetbrains.kotlin.plugin.compose</groupId>
                <artifactId>org.jetbrains.kotlin.plugin.compose.gradle.plugin</artifactId>
                <version>${KOTLIN_VERSION}</version>
              </dependency>

            </dependencies>

          </project>
          EOF

      - name: Resolve AndroidX and Compose dependencies
        shell: bash
        run: |
          set -euxo pipefail

          cd native-build

          mvn \
            -B \
            -q \
            dependency:copy-dependencies \
            -DoutputDirectory=libs \
            -DincludeScope=runtime

          echo "Resolved libraries:"

          find libs \
            -type f \
            \( -name "*.jar" -o -name "*.aar" \) \
            -print \
            | sort

          test -n "$(find libs -type f -name '*.jar' -print -quit)"

      - name: Extract Android AAR libraries
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p native-build/aar-classes
          mkdir -p native-build/aar-res

          while IFS= read -r aar; do

            name="$(basename "${aar}" .aar)"
            dir="native-build/aar-${name}"

            rm -rf "${dir}"
            mkdir -p "${dir}"

            unzip -q "${aar}" -d "${dir}"

            if [ -d "${dir}/classes.jar" ]; then
              cp "${dir}/classes.jar" \
                "native-build/aar-classes/${name}.jar"
            fi

            if [ -d "${dir}/res" ]; then
              cp -R "${dir}/res" \
                "native-build/aar-res/${name}"
            fi

          done < <(
            find native-build/libs \
              -type f \
              -name "*.aar"
          )

      - name: Build Kotlin classpath
        shell: bash
        run: |
          set -euxo pipefail

          ANDROID_JAR="${ANDROID_HOME}/platforms/android-${ANDROID_API}/android.jar"

          CLASSPATH="${ANDROID_JAR}"

          while IFS= read -r jar; do
            CLASSPATH="${CLASSPATH}:${jar}"
          done < <(
            find native-build/libs native-build/aar-classes \
              -type f \
              -name "*.jar" \
              | sort
          )

          echo "KOTLIN_CLASSPATH=${CLASSPATH}" \
            >> "${GITHUB_ENV}"

      - name: Discover production Kotlin sources
        shell: bash
        run: |
          set -euxo pipefail

          find app/src/main \
            -type f \
            -name "*.kt" \
            ! -name "*Test.kt" \
            ! -name "*Test*.kt" \
            -print \
            > native-build/kotlin-sources.txt

          echo "Production Kotlin sources:"

          cat native-build/kotlin-sources.txt

          test -s native-build/kotlin-sources.txt

      - name: Compile generated Java
        shell: bash
        run: |
          set -euxo pipefail

          find native-build/generated \
            -type f \
            -name "*.java" \
            -print \
            > native-build/generated-java.txt

          if [ -s native-build/generated-java.txt ]; then

            javac \
              -source 17 \
              -target 17 \
              -encoding UTF-8 \
              -classpath "${KOTLIN_CLASSPATH}" \
              -d native-build/classes \
              @native-build/generated-java.txt

          fi

      - name: Locate Compose compiler plugin
        shell: bash
        run: |
          set -euxo pipefail

          COMPOSE_PLUGIN="$(
            find native-build/libs \
              -type f \
              \( \
                -name "*compose*compiler*.jar" \
                -o \
                -name "*compose*.gradle.plugin*.jar" \
              \) \
              -print \
              | head -n 1
          )"

          if [ -z "${COMPOSE_PLUGIN}" ]; then
            echo "::error::Compose compiler plugin was not resolved"

            find native-build/libs \
              -type f \
              -name "*.jar" \
              -print \
              | sort

            exit 1
          fi

          echo "Compose compiler candidate:"
          echo "${COMPOSE_PLUGIN}"

          echo "COMPOSE_PLUGIN=${COMPOSE_PLUGIN}" \
            >> "${GITHUB_ENV}"

      - name: Compile Kotlin and Compose
        shell: bash
        run: |
          set -euxo pipefail

          kotlinc \
            -jvm-target 17 \
            -classpath "${KOTLIN_CLASSPATH}" \
            -Xplugin="${COMPOSE_PLUGIN}" \
            -d native-build/classes \
            @native-build/kotlin-sources.txt

      - name: Verify compiled classes
        shell: bash
        run: |
          set -euxo pipefail

          find native-build/classes \
            -type f \
            -name "*.class" \
            -print \
            | sort

          test -n "$(
            find native-build/classes \
              -type f \
              -name "*.class" \
              -print \
              -quit
          )"

      - name: Build D8 classpath
        shell: bash
        run: |
          set -euxo pipefail

          D8_CLASSPATH=""

          while IFS= read -r jar; do
            if [ -z "${D8_CLASSPATH}" ]; then
              D8_CLASSPATH="${jar}"
            else
              D8_CLASSPATH="${D8_CLASSPATH}:${jar}"
            fi
          done < <(
            find native-build/libs native-build/aar-classes \
              -type f \
              -name "*.jar" \
              | sort
          )

          echo "D8_CLASSPATH=${D8_CLASSPATH}" \
            >> "${GITHUB_ENV}"

      - name: Convert classes and libraries to DEX
        shell: bash
        run: |
          set -euxo pipefail

          D8="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/d8"
          ANDROID_JAR="${ANDROID_HOME}/platforms/android-${ANDROID_API}/android.jar"

          mapfile -t CLASS_FILES < <(
            find native-build/classes \
              -type f \
              -name "*.class"
          )

          test "${#CLASS_FILES[@]}" -gt 0

          mapfile -t LIBRARIES < <(
            find native-build/libs native-build/aar-classes \
              -type f \
              -name "*.jar"
          )

          "${D8}" \
            --lib "${ANDROID_JAR}" \
            --min-api "${MIN_SDK}" \
            --output native-build/dex \
            "${CLASS_FILES[@]}" \
            "${LIBRARIES[@]}"

          test -f native-build/dex/classes.dex

      - name: Package unsigned APK
        shell: bash
        run: |
          set -euxo pipefail

          cd native-build/apk

          unzip -q ../resources.apk

          cp ../dex/classes.dex .

          zip \
            -q \
            -r \
            ../unsigned.apk \
            .

          test -f ../unsigned.apk

      - name: Align APK
        shell: bash
        run: |
          set -euxo pipefail

          ZIPALIGN="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/zipalign"

          "${ZIPALIGN}" \
            -f \
            4 \
            native-build/unsigned.apk \
            native-build/aligned.apk

      - name: Create debug signing key
        shell: bash
        run: |
          set -euxo pipefail

          keytool \
            -genkeypair \
            -v \
            -keystore native-build/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Sign APK
        shell: bash
        run: |
          set -euxo pipefail

          APKSIGNER="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner"

          "${APKSIGNER}" sign \
            --ks native-build/debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --out native-build/app-debug.apk \
            native-build/aligned.apk

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail

          APKSIGNER="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner"

          "${APKSIGNER}" verify --verbose \
            native-build/app-debug.apk

          test -s native-build/app-debug.apk

          ls -lh native-build/app-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v5
        with:
          name: debug-apk
          path: native-build/app-debug.apk
          if-no-files-found: error
