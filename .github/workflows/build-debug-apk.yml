name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK Without Gradle
    runs-on: ubuntu-latest

    env:
      ANDROID_API: "35"
      BUILD_TOOLS: "35.0.0"
      PACKAGE_NAME: "com.example.socialcontract"
      KOTLIN_VERSION: "2.1.21"
      MIN_SDK: "23"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euxo pipefail

          ANDROID_JAR="${ANDROID_HOME}/platforms/android-${ANDROID_API}/android.jar"
          BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}"

          test -f "${ANDROID_JAR}"
          test -x "${BUILD_TOOLS_DIR}/aapt2"
          test -x "${BUILD_TOOLS_DIR}/d8"
          test -x "${BUILD_TOOLS_DIR}/zipalign"
          test -x "${BUILD_TOOLS_DIR}/apksigner"

          java -version

      - name: Install Kotlin compiler
        shell: bash
        run: |
          set -euxo pipefail

          KOTLIN_URL="https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            "${KOTLIN_URL}" \
            --output kotlin-compiler.zip

          test -s kotlin-compiler.zip

          rm -rf kotlin-dist

          mkdir -p kotlin-dist

          unzip \
            -q \
            kotlin-compiler.zip \
            -d kotlin-dist

          echo "Kotlin compiler contents:"
          find kotlin-dist \
            -type f \
            -name kotlinc \
            -print

          KOTLINC="$(find kotlin-dist \
            -type f \
            -name kotlinc \
            -print \
            -quit)"

          if [ -z "${KOTLINC}" ]; then
            echo "::error::kotlinc executable was not found"
            echo "Archive contents:"
            find kotlin-dist -maxdepth 4 -type f | sort
            exit 1
          fi

          KOTLIN_BIN="$(dirname "${KOTLINC}")"

          echo "Kotlin compiler: ${KOTLINC}"
          echo "Kotlin bin: ${KOTLIN_BIN}"

          chmod +x "${KOTLINC}"

          echo "${KOTLIN_BIN}" >> "${GITHUB_PATH}"

          "${KOTLINC}" -version

      - name: Prepare build directories
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf native-build

          mkdir -p \
            native-build/compiled-res \
            native-build/generated \
            native-build/classes \
            native-build/dex \
            native-build/apk

      - name: Generate native manifest
        shell: bash
        run: |
          set -euxo pipefail

          python3 - "${PACKAGE_NAME}" <<'PY'
          from pathlib import Path
          import re
          import sys

          package_name = sys.argv[1]

          source = Path("app/src/main/AndroidManifest.xml")
          target = Path("native-build/AndroidManifest.xml")

          if not source.is_file():
              raise SystemExit(
                  "app/src/main/AndroidManifest.xml was not found"
              )

          text = source.read_text(encoding="utf-8")

          text = re.sub(
              r'\s+package\s*=\s*"[^"]*"',
              "",
              text,
              count=1,
          )

          text = re.sub(
              r"<manifest\b",
              f'<manifest package="{package_name}"',
              text,
              count=1,
          )

          target.write_text(text, encoding="utf-8")
          PY

          grep -q \
            "package=\"${PACKAGE_NAME}\"" \
            native-build/AndroidManifest.xml

      - name: Compile Android resources
        shell: bash
        run: |
          set -euxo pipefail

          AAPT2="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt2"

          if [ ! -d app/src/main/res ]; then
            echo "::error::app/src/main/res does not exist"
            exit 1
          fi

          find app/src/main/res \
            -type f \
            -print0 |
          while IFS= read -r -d '' resource; do
            echo "Compiling: ${resource}"

            "${AAPT2}" compile \
              --legacy \
              -o native-build/compiled-res \
              "${resource}"
          done

      - name: Link Android resources
        shell: bash
        run: |
          set -euxo pipefail

          AAPT2="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt2"
          ANDROID_JAR="${ANDROID_HOME}/platforms/android-${ANDROID_API}/android.jar"

          mapfile -t FLAT_FILES < <(
            find native-build/compiled-res \
              -type f \
              -name "*.flat"
          )

          test "${#FLAT_FILES[@]}" -gt 0

          "${AAPT2}" link \
            -o native-build/resources.apk \
            --manifest native-build/AndroidManifest.xml \
            -I "${ANDROID_JAR}" \
            --java native-build/generated \
            --auto-add-overlay \
            "${FLAT_FILES[@]}"

          test -f native-build/resources.apk

      - name: Discover Kotlin sources
        shell: bash
        run: |
          set -euxo pipefail

          find app/src/main \
            -type f \
            -name "*.kt" \
            -print \
            > native-build/kotlin-sources.txt

          echo "Kotlin sources:"
          cat native-build/kotlin-sources.txt

          test -s native-build/kotlin-sources.txt

      - name: Compile generated Java sources
        shell: bash
        run: |
          set -euxo pipefail

          ANDROID_JAR="${ANDROID_HOME}/platforms/android-${ANDROID_API}/android.jar"

          find native-build/generated \
            -type f \
            -name "*.java" \
            -print \
            > native-build/generated-java.txt

          if [ -s native-build/generated-java.txt ]; then
            javac \
              -source 17 \
              -target 17 \
              -encoding UTF-8 \
              -classpath "${ANDROID_JAR}" \
              -d native-build/classes \
              @native-build/generated-java.txt
          fi

      - name: Compile Kotlin sources
        shell: bash
        run: |
          set -euxo pipefail

          ANDROID_JAR="${ANDROID_HOME}/platforms/android-${ANDROID_API}/android.jar"

          kotlinc \
            -jvm-target 17 \
            -classpath \
              "${ANDROID_JAR}:native-build/classes" \
            -d native-build/classes \
            @native-build/kotlin-sources.txt

      - name: Convert classes to DEX
        shell: bash
        run: |
          set -euxo pipefail

          D8="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/d8"
          ANDROID_JAR="${ANDROID_HOME}/platforms/android-${ANDROID_API}/android.jar"

          mapfile -t CLASS_FILES < <(
            find native-build/classes \
              -type f \
              -name "*.class"
          )

          test "${#CLASS_FILES[@]}" -gt 0

          "${D8}" \
            --lib "${ANDROID_JAR}" \
            --min-api "${MIN_SDK}" \
            --output native-build/dex \
            "${CLASS_FILES[@]}"

          test -f native-build/dex/classes.dex

      - name: Package unsigned APK
        shell: bash
        run: |
          set -euxo pipefail

          cd native-build/apk

          unzip -q ../resources.apk

          cp ../dex/classes.dex .

          zip \
            -q \
            -r \
            ../unsigned.apk \
            .

          test -f ../unsigned.apk

      - name: Align APK
        shell: bash
        run: |
          set -euxo pipefail

          ZIPALIGN="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/zipalign"

          "${ZIPALIGN}" \
            -f \
            4 \
            native-build/unsigned.apk \
            native-build/aligned.apk

          test -f native-build/aligned.apk

      - name: Create debug signing key
        shell: bash
        run: |
          set -euxo pipefail

          keytool \
            -genkeypair \
            -v \
            -keystore native-build/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Sign APK
        shell: bash
        run: |
          set -euxo pipefail

          APKSIGNER="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner"

          "${APKSIGNER}" sign \
            --ks native-build/debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --out native-build/app-debug.apk \
            native-build/aligned.apk

          test -f native-build/app-debug.apk

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail

          APKSIGNER="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner"

          "${APKSIGNER}" verify --verbose native-build/app-debug.apk

          ls -lh native-build/app-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v5
        with:
          name: debug-apk
          path: native-build/app-debug.apk
          if-no-files-found: error
