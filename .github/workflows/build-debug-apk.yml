name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          validate-wrappers: false

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version

          test -f "${ANDROID_HOME}/platforms/android-35/android.jar"
          test -x "${ANDROID_HOME}/build-tools/35.0.0/aapt2"
          test -x "${ANDROID_HOME}/build-tools/35.0.0/d8"
          test -x "${ANDROID_HOME}/build-tools/35.0.0/apksigner"

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Verify manifest does not contain package attribute
        shell: bash
        run: |
          set -euo pipefail

          if grep -Eq '<manifest[^>]*package=' \
            app/src/main/AndroidManifest.xml; then
            echo "::error::Remove package= from app/src/main/AndroidManifest.xml"
            exit 1
          fi

      - name: Verify Kotlin source tree
        shell: bash
        run: |
          set -euo pipefail

          test -d app/src/main

          find app/src/main \
            -type f \
            -name "*.kt" \
            -print

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "${APK}"

          ls -lh "${APK}"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="${ANDROID_HOME}/build-tools/35.0.0/apksigner"

          "${APKSIGNER}" verify --verbose \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v5
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
