name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build CropShare Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          validate-wrappers: false

      - name: Verify project structure
        shell: bash
        run: |
          set -euxo pipefail

          echo "Repository root:"
          pwd

          echo "Top-level files:"
          ls -la

          test -f app/src/main/AndroidManifest.xml

          if [ -f settings.gradle.kts ]; then
            echo "settings.gradle.kts found"
          elif [ -f settings.gradle ]; then
            echo "settings.gradle found"
          else
            echo "::error::No settings.gradle.kts or settings.gradle found."
            exit 1
          fi

          if [ -f app/build.gradle.kts ]; then
            echo "app/build.gradle.kts found"
          elif [ -f app/build.gradle ]; then
            echo "app/build.gradle found"
          else
            echo "::error::No app Gradle build file found."
            exit 1
          fi

      - name: Verify Kotlin source
        shell: bash
        run: |
          set -euxo pipefail

          echo "Kotlin source files:"

          find app/src/main \
            -type f \
            -name "*.kt" \
            -print \
            | sort

          test -n "$(
            find app/src/main \
              -type f \
              -name "*.kt" \
              -print \
              -quit
          )"

      - name: Remove manifest package attribute
        shell: bash
        run: |
          set -euxo pipefail

          MANIFEST="app/src/main/AndroidManifest.xml"

          python3 - "${MANIFEST}" <<'PY'
          from pathlib import Path
          import re
          import sys

          manifest = Path(sys.argv[1])

          text = manifest.read_text(encoding="utf-8")

          updated = re.sub(
              r'\s+package\s*=\s*"[^"]*"',
              "",
              text,
              count=1,
          )

          if updated != text:
              manifest.write_text(updated, encoding="utf-8")
              print("Removed package attribute from AndroidManifest.xml")
          else:
              print("No package attribute found")

          if re.search(
              r"<manifest\b[^>]*\bpackage\s*=",
              updated,
          ):
              raise SystemExit(
                  "ERROR: package attribute is still present "
                  "in AndroidManifest.xml"
              )
          PY

      - name: Verify Gradle namespace
        shell: bash
        run: |
          set -euxo pipefail

          if [ -f app/build.gradle.kts ]; then
            BUILD_FILE="app/build.gradle.kts"
          else
            BUILD_FILE="app/build.gradle"
          fi

          echo "Using: ${BUILD_FILE}"

          grep -n "namespace" "${BUILD_FILE}"

          if ! grep -Eq \
            '^[[:space:]]*namespace[[:space:]]*=' \
            "${BUILD_FILE}"; then

            echo "::error::Android namespace is missing."
            echo "::error::Add namespace to ${BUILD_FILE}."
            exit 1
          fi

      - name: Verify Gradle
        shell: bash
        run: |
          set -euxo pipefail

          gradle --version

      - name: Clean project
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf native-build

          gradle clean \
            --no-daemon \
            --stacktrace

      - name: Build Debug APK
        shell: bash
        run: |
          set -euxo pipefail

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          set -euxo pipefail

          echo "APK files:"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print \
            | sort

          test -f \
            app/build/outputs/apk/debug/app-debug.apk

          test -s \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          APKSIGNER="${ANDROID_HOME}/build-tools/35.0.0/apksigner"

          "${APKSIGNER}" verify \
            --verbose \
            "${APK}"

          ls -lh "${APK}"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v5
        with:
          name: cropshare-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
