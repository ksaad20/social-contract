name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    env:
      ANDROID_API: "35"
      BUILD_TOOLS: "35.0.0"
      JAVA_VERSION: "17"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          test -f "${ANDROID_HOME}/platforms/android-${ANDROID_API}/android.jar"
          test -x "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt2"
          test -x "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/d8"
          test -x "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/zipalign"
          test -x "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner"

          java -version

      # ---------------------------------------------------------------
      # Use the project's Gradle build.
      #
      # This is intentionally NOT using:
      #   - Maven
      #   - manual Kotlin compilation
      #   - manual Compose compiler invocation
      #   - manual AAPT2 linking
      #   - manually assembled APKs
      #
      # Gradle + Android Gradle Plugin correctly resolve:
      #   Kotlin
      #   AndroidX
      #   Compose
      #   Material3
      #   Compose compiler
      #   transitive dependencies
      #   AAR libraries
      #   resources
      #   DEX
      #   manifest merging
      #   APK signing
      # ---------------------------------------------------------------

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          validate-wrappers: false

      - name: Verify Gradle
        shell: bash
        run: |
          set -euxo pipefail

          gradle --version

      # ---------------------------------------------------------------
      # AndroidManifest.xml must NOT contain a package= attribute.
      #
      # Modern Android Gradle Plugin uses namespace from
      # app/build.gradle.kts instead.
      #
      # This only modifies the CI checkout; it does not modify Git.
      # ---------------------------------------------------------------

      - name: Normalize Android manifest
        shell: bash
        run: |
          set -euxo pipefail

          MANIFEST="app/src/main/AndroidManifest.xml"

          test -f "${MANIFEST}"

          python3 - "${MANIFEST}" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          updated = re.sub(
              r'\s+package\s*=\s*"[^"]*"',
              "",
              text,
              count=1,
          )

          path.write_text(updated, encoding="utf-8")
          PY

          if grep -Eq '<manifest[^>]*[[:space:]]package[[:space:]]*=' "${MANIFEST}"; then
            echo "::error::AndroidManifest.xml still contains package="
            exit 1
          fi

          echo "AndroidManifest.xml is compatible with modern AGP."

      # ---------------------------------------------------------------
      # Verify that this is actually a Kotlin Android project.
      # ---------------------------------------------------------------

      - name: Verify Kotlin Android project
        shell: bash
        run: |
          set -euxo pipefail

          test -f settings.gradle.kts || \
            test -f settings.gradle

          test -f build.gradle.kts || \
            test -f build.gradle

          test -f app/build.gradle.kts || \
            test -f app/build.gradle

          test -d app/src/main

          echo "Project structure:"
          find app/src/main -maxdepth 4 -type f | sort

      # ---------------------------------------------------------------
      # Verify the Kotlin source tree.
      # ---------------------------------------------------------------

      - name: Verify Kotlin sources
        shell: bash
        run: |
          set -euxo pipefail

          mapfile -t KOTLIN_FILES < <(
            find app/src/main \
              -type f \
              -name "*.kt" \
              -print
          )

          test "${#KOTLIN_FILES[@]}" -gt 0

          echo "Kotlin production sources:"
          printf '%s\n' "${KOTLIN_FILES[@]}"

      # ---------------------------------------------------------------
      # Check that MainActivity exists and inspect its package.
      # ---------------------------------------------------------------

      - name: Verify MainActivity
        shell: bash
        run: |
          set -euxo pipefail

          mapfile -t ACTIVITIES < <(
            find app/src/main \
              -type f \
              \( \
                -name "MainActivity.kt" \
                -o \
                -name "MainActivity.java" \
              \) \
              -print
          )

          if [ "${#ACTIVITIES[@]}" -eq 0 ]; then
            echo "::error::MainActivity source file was not found."
            exit 1
          fi

          echo "MainActivity source:"
          printf '%s\n' "${ACTIVITIES[@]}"

          for file in "${ACTIVITIES[@]}"; do
            echo "----- ${file} -----"
            sed -n '1,80p' "${file}"
          done

      # ---------------------------------------------------------------
      # Print the Android namespace/application ID configuration.
      # This makes namespace/package mistakes immediately visible.
      # ---------------------------------------------------------------

      - name: Inspect Gradle Android configuration
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== app/build.gradle.kts ====="

          if [ -f app/build.gradle.kts ]; then
            sed -n '1,240p' app/build.gradle.kts
          else
            sed -n '1,240p' app/build.gradle
          fi

          echo "===== settings ====="

          if [ -f settings.gradle.kts ]; then
            sed -n '1,200p' settings.gradle.kts
          else
            sed -n '1,200p' settings.gradle
          fi

      # ---------------------------------------------------------------
      # Resolve dependencies using Gradle.
      #
      # This is the important replacement for the failing Maven step.
      # ---------------------------------------------------------------

      - name: Resolve Gradle dependencies
        shell: bash
        run: |
          set -euxo pipefail

          gradle \
            :app:dependencies \
            --configuration debugRuntimeClasspath \
            --no-daemon

      # ---------------------------------------------------------------
      # Build the actual Android APK.
      # ---------------------------------------------------------------

      - name: Build Debug APK
        shell: bash
        run: |
          set -euxo pipefail

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      # ---------------------------------------------------------------
      # Locate generated APK.
      # ---------------------------------------------------------------

      - name: Locate APK
        shell: bash
        run: |
          set -euxo pipefail

          echo "Generated APK files:"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          test -n "$(
            find app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              -print \
              -quit
          )"

      # ---------------------------------------------------------------
      # Verify APK with Android's official signing tool.
      # ---------------------------------------------------------------

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail

          APKSIGNER="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner"

          mapfile -t APKS < <(
            find app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              -print
          )

          test "${#APKS[@]}" -gt 0

          for apk in "${APKS[@]}"; do
            echo "===== ${apk} ====="
            "${APKSIGNER}" verify --verbose "${apk}"
            ls -lh "${apk}"
          done

      # ---------------------------------------------------------------
      # Upload APK.
      # ---------------------------------------------------------------

      - name: Upload Debug APK
        uses: actions/upload-artifact@v5
        with:
          name: cropshare-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
