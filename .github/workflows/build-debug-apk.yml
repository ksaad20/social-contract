name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK Without Gradle
    runs-on: ubuntu-latest

    env:
      ANDROID_API: "35"
      BUILD_TOOLS: "35.0.0"
      MIN_SDK: "23"
      PACKAGE_NAME: "com.example.socialcontract"

      KOTLIN_VERSION: "2.1.21"

      COMPOSE_VERSION: "1.8.3"
      ACTIVITY_COMPOSE: "1.10.1"
      MATERIAL3: "1.4.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euxo pipefail

          SDK="${ANDROID_HOME}"
          BT="${SDK}/build-tools/${BUILD_TOOLS}"

          test -f "${SDK}/platforms/android-${ANDROID_API}/android.jar"
          test -x "${BT}/aapt2"
          test -x "${BT}/d8"
          test -x "${BT}/zipalign"
          test -x "${BT}/apksigner"

          java -version

      - name: Install Kotlin compiler
        shell: bash
        run: |
          set -euxo pipefail

          KOTLIN_URL="https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            "${KOTLIN_URL}" \
            --output kotlin.zip

          test -s kotlin.zip

          rm -rf kotlin-dist
          mkdir -p kotlin-dist

          unzip -q kotlin.zip -d kotlin-dist

          KOTLINC="$(
            find kotlin-dist \
              -type f \
              -name kotlinc \
              -print \
              -quit
          )"

          test -n "${KOTLINC}"

          chmod +x "${KOTLINC}"

          KOTLIN_BIN="$(dirname "${KOTLINC}")"

          echo "${KOTLIN_BIN}" >> "${GITHUB_PATH}"

          "${KOTLINC}" -version

      - name: Prepare build directories
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf native-build

          mkdir -p \
            native-build/compiled-res \
            native-build/generated \
            native-build/classes \
            native-build/dex \
            native-build/apk \
            native-build/libs \
            native-build/aar-classes \
            native-build/aar-res

      - name: Validate Android project
        shell: bash
        run: |
          set -euxo pipefail

          test -f app/src/main/AndroidManifest.xml
          test -d app/src/main/res

          if grep -Eq '<manifest[^>]*[[:space:]]package[[:space:]]*=' \
            app/src/main/AndroidManifest.xml; then
            echo "::error::AndroidManifest.xml must not contain package=."
            echo "The package is supplied by the native build manifest."
            exit 1
          fi

      - name: Generate native manifest
        shell: bash
        run: |
          set -euxo pipefail

          python3 - "${PACKAGE_NAME}" <<'PY'
          from pathlib import Path
          import re
          import sys

          package_name = sys.argv[1]

          source = Path("app/src/main/AndroidManifest.xml")
          target = Path("native-build/AndroidManifest.xml")

          text = source.read_text(encoding="utf-8")

          text = re.sub(
              r"\s+package\s*=\s*\"[^\"]*\"",
              "",
              text,
              count=1,
          )

          text = re.sub(
              r"<manifest\b",
              f'<manifest package="{package_name}"',
              text,
              count=1,
          )

          target.write_text(text, encoding="utf-8")
          PY

          grep -q \
            "package=\"${PACKAGE_NAME}\"" \
            native-build/AndroidManifest.xml

      - name: Compile Android resources
        shell: bash
        run: |
          set -euxo pipefail

          AAPT2="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt2"

          mapfile -t RESOURCES < <(
            find app/src/main/res \
              -type f \
              -print
          )

          for resource in "${RESOURCES[@]}"; do
            "${AAPT2}" compile \
              --legacy \
              -o native-build/compiled-res \
              "${resource}"
          done

      - name: Link Android resources
        shell: bash
        run: |
          set -euxo pipefail

          AAPT2="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt2"
          ANDROID_JAR="${ANDROID_HOME}/platforms/android-${ANDROID_API}/android.jar"

          mapfile -t FLAT < <(
            find native-build/compiled-res \
              -type f \
              -name "*.flat"
          )

          test "${#FLAT[@]}" -gt 0

          "${AAPT2}" link \
            -o native-build/resources.apk \
            --manifest native-build/AndroidManifest.xml \
            -I "${ANDROID_JAR}" \
            --java native-build/generated \
            --auto-add-overlay \
            "${FLAT[@]}"

          test -s native-build/resources.apk

      - name: Install Maven
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y maven

          mvn --version

      - name: Create dependency descriptor
        shell: bash
        run: |
          set -euxo pipefail

          cat > native-build/pom.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">

            <modelVersion>4.0.0</modelVersion>

            <groupId>com.socialcontract</groupId>
            <artifactId>native-build</artifactId>
            <version>1.0.0</version>

            <properties>
              <kotlin.version>${KOTLIN_VERSION}</kotlin.version>
              <compose.version>${COMPOSE_VERSION}</compose.version>
              <activity.compose.version>${ACTIVITY_COMPOSE}</activity.compose.version>
              <material3.version>${MATERIAL3}</material3.version>
            </properties>

            <repositories>
              <repository>
                <id>google</id>
                <url>https://dl.google.com/dl/android/maven2/</url>
              </repository>

              <repository>
                <id>central</id>
                <url>https://repo1.maven.org/maven2/</url>
              </repository>
            </repositories>

            <dependencyManagement>
              <dependencies>

                <dependency>
                  <groupId>androidx.compose.runtime</groupId>
                  <artifactId>runtime</artifactId>
                  <version>${compose.version}</version>
                </dependency>

                <dependency>
                  <groupId>androidx.compose.ui</groupId>
                  <artifactId>ui</artifactId>
                  <version>${compose.version}</version>
                </dependency>

                <dependency>
                  <groupId>androidx.compose.ui</groupId>
                  <artifactId>ui-tooling-preview</artifactId>
                  <version>${compose.version}</version>
                </dependency>

                <dependency>
                  <groupId>androidx.compose.foundation</groupId>
                  <artifactId>foundation</artifactId>
                  <version>${compose.version}</version>
                </dependency>

                <dependency>
                  <groupId>androidx.compose.animation</groupId>
                  <artifactId>animation</artifactId>
                  <version>${compose.version}</version>
                </dependency>

                <dependency>
                  <groupId>androidx.compose.foundation</groupId>
                  <artifactId>foundation-layout</artifactId>
                  <version>${compose.version}</version>
                </dependency>

                <dependency>
                  <groupId>androidx.compose.material3</groupId>
                  <artifactId>material3</artifactId>
                  <version>${material3.version}</version>
                </dependency>

              </dependencies>
            </dependencyManagement>

            <dependencies>

              <dependency>
                <groupId>androidx.activity</groupId>
                <artifactId>activity-compose</artifactId>
                <version>${activity.compose.version}</version>
              </dependency>

              <dependency>
                <groupId>androidx.compose.runtime</groupId>
                <artifactId>runtime</artifactId>
              </dependency>

              <dependency>
                <groupId>androidx.compose.ui</groupId>
                <artifactId>ui</artifactId>
              </dependency>

              <dependency>
                <groupId>androidx.compose.ui</groupId>
                <artifactId>ui-tooling-preview</artifactId>
              </dependency>

              <dependency>
                <groupId>androidx.compose.foundation</groupId>
                <artifactId>foundation</artifactId>
              </dependency>

              <dependency>
                <groupId>androidx.compose.material3</groupId>
                <artifactId>material3</artifactId>
              </dependency>

              <dependency>
                <groupId>org.jetbrains.kotlin</groupId>
                <artifactId>kotlin-stdlib</artifactId>
                <version>${kotlin.version}</version>
              </dependency>

            </dependencies>

          </project>
          EOF

      - name: Resolve dependencies
        shell: bash
        run: |
          set -euxo pipefail

          cd native-build

          mvn \
            -B \
            -q \
            dependency:copy-dependencies \
            -DoutputDirectory=libs \
            -DincludeScope=runtime

          find libs \
            -type f \
            \( -name "*.jar" -o -name "*.aar" \) \
            -print \
            | sort

          test -n "$(
            find libs \
              -type f \
              -name "*.jar" \
              -print \
              -quit
          )"

      - name: Extract AAR libraries
        shell: bash
        run: |
          set -euxo pipefail

          while IFS= read -r aar; do

            name="$(basename "${aar}" .aar)"
            dir="native-build/aar-${name}"

            rm -rf "${dir}"
            mkdir -p "${dir}"

            unzip -q "${aar}" -d "${dir}"

            if [ -f "${dir}/classes.jar" ]; then
              cp \
                "${dir}/classes.jar" \
                "native-build/aar-classes/${name}.jar"
            fi

            if [ -d "${dir}/res" ]; then
              cp -R \
                "${dir}/res" \
                "native-build/aar-res/${name}"
            fi

          done < <(
            find native-build/libs \
              -type f \
              -name "*.aar"
          )

      - name: Compile generated Java
        shell: bash
        run: |
          set -euxo pipefail

          ANDROID_JAR="${ANDROID_HOME}/platforms/android-${ANDROID_API}/android.jar"

          mapfile -t GENERATED_JAVA < <(
            find native-build/generated \
              -type f \
              -name "*.java"
          )

          if [ "${#GENERATED_JAVA[@]}" -gt 0 ]; then

            javac \
              -source 17 \
              -target 17 \
              -encoding UTF-8 \
              -classpath "${ANDROID_JAR}" \
              -d native-build/classes \
              "${GENERATED_JAVA[@]}"

          fi

      - name: Discover production Kotlin sources
        shell: bash
        run: |
          set -euxo pipefail

          find app/src/main \
            -type f \
            -name "*.kt" \
            ! -name "*Test.kt" \
            ! -path "*/androidTest/*" \
            ! -path "*/test/*" \
            -print \
            > native-build/kotlin-sources.txt

          cat native-build/kotlin-sources.txt

          test -s native-build/kotlin-sources.txt

      - name: Build Kotlin classpath
        shell: bash
        run: |
          set -euxo pipefail

          ANDROID_JAR="${ANDROID_HOME}/platforms/android-${ANDROID_API}/android.jar"

          CLASSPATH="${ANDROID_JAR}"

          while IFS= read -r jar; do
            CLASSPATH="${CLASSPATH}:${jar}"
          done < <(
            find native-build/libs native-build/aar-classes \
              -type f \
              -name "*.jar" \
              | sort
          )

          echo "KOTLIN_CLASSPATH=${CLASSPATH}" >> "${GITHUB_ENV}"

      - name: Compile Kotlin
        shell: bash
        run: |
          set -euxo pipefail

          kotlinc \
            -jvm-target 17 \
            -classpath "${KOTLIN_CLASSPATH}" \
            -d native-build/classes \
            @native-build/kotlin-sources.txt

      - name: Verify classes
        shell: bash
        run: |
          set -euxo pipefail

          find native-build/classes \
            -type f \
            -name "*.class" \
            -print

          test -n "$(
            find native-build/classes \
              -type f \
              -name "*.class" \
              -print \
              -quit
          )"

      - name: Convert classes and dependencies to DEX
        shell: bash
        run: |
          set -euxo pipefail

          D8="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/d8"
          ANDROID_JAR="${ANDROID_HOME}/platforms/android-${ANDROID_API}/android.jar"

          mapfile -t INPUTS < <(
            find native-build/classes \
              -type f \
              -name "*.class"
          )

          while IFS= read -r jar; do
            INPUTS+=("${jar}")
          done < <(
            find native-build/libs native-build/aar-classes \
              -type f \
              -name "*.jar"
          )

          test "${#INPUTS[@]}" -gt 0

          "${D8}" \
            --lib "${ANDROID_JAR}" \
            --min-api "${MIN_SDK}" \
            --output native-build/dex \
            "${INPUTS[@]}"

          test -s native-build/dex/classes.dex

      - name: Package unsigned APK
        shell: bash
        run: |
          set -euxo pipefail

          cd native-build/apk

          unzip -q ../resources.apk

          cp ../dex/classes.dex .

          zip \
            -q \
            -r \
            ../unsigned.apk \
            .

          test -s ../unsigned.apk

      - name: Align APK
        shell: bash
        run: |
          set -euxo pipefail

          ZIPALIGN="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/zipalign"

          "${ZIPALIGN}" \
            -f \
            4 \
            native-build/unsigned.apk \
            native-build/aligned.apk

          test -s native-build/aligned.apk

      - name: Create debug signing key
        shell: bash
        run: |
          set -euxo pipefail

          keytool \
            -genkeypair \
            -v \
            -keystore native-build/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Sign APK
        shell: bash
        run: |
          set -euxo pipefail

          APKSIGNER="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner"

          "${APKSIGNER}" sign \
            --ks native-build/debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --out native-build/app-debug.apk \
            native-build/aligned.apk

          test -s native-build/app-debug.apk

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail

          APKSIGNER="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner"

          "${APKSIGNER}" verify \
            --verbose \
            native-build/app-debug.apk

          ls -lh native-build/app-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v5
        with:
          name: debug-apk
          path: native-build/app-debug.apk
          if-no-files-found: error
