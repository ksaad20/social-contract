name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    env:
      JAVA_VERSION: "17"
      GRADLE_VERSION: "8.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          sdkmanager "platform-tools" \
                      "platforms;android-35" \
                      "build-tools;35.0.0"

      - name: Verify project structure
        shell: bash
        run: |
          set -euxo pipefail

          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts

          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Android project structure:"
          find app/src/main -maxdepth 3 -type f | sort

      - name: Remove obsolete manifest package attribute
        shell: bash
        run: |
          set -euxo pipefail

          MANIFEST="app/src/main/AndroidManifest.xml"

          test -f "${MANIFEST}"

          python3 - "${MANIFEST}" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          original = text

          # Android Gradle Plugin 8+ requires namespace to be declared
          # in Gradle configuration rather than the source manifest.
          text = re.sub(
              r'\s+package\s*=\s*"[^"]*"',
              "",
              text,
              count=1,
          )

          if text != original:
              path.write_text(text, encoding="utf-8")
              print("Removed package attribute from AndroidManifest.xml")
          else:
              print("No manifest package attribute found")

          if re.search(r'<manifest\b[^>]*\bpackage\s*=', text):
              raise SystemExit(
                  "ERROR: AndroidManifest.xml still contains a package attribute"
              )
          PY

          sed -n '1,80p' "${MANIFEST}"

      - name: Verify Gradle namespace
        shell: bash
        run: |
          set -euxo pipefail

          BUILD_FILE="app/build.gradle.kts"

          if [ ! -f "${BUILD_FILE}" ]; then
            BUILD_FILE="app/build.gradle"
          fi

          test -f "${BUILD_FILE}"

          echo "Using module build file: ${BUILD_FILE}"

          if grep -Eq '^[[:space:]]*namespace[[:space:]]*=' "${BUILD_FILE}"; then
            echo "Namespace declaration found:"
            grep -nE '^[[:space:]]*namespace[[:space:]]*=' "${BUILD_FILE}"
          else
            echo "::error::No namespace declaration found in ${BUILD_FILE}"
            echo
            echo "The Android Gradle Plugin requires:"
            echo 'namespace = "com.example.socialcontract"'
            echo
            sed -n '1,180p' "${BUILD_FILE}"
            exit 1
          fi

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Verify Gradle
        shell: bash
        run: |
          set -euxo pipefail
          gradle --version

      - name: Check for obsolete native build workflow
        shell: bash
        run: |
          set -euxo pipefail

          echo "Checking repository workflow files for obsolete Maven/native-build workflows..."

          found=0

          while IFS= read -r workflow; do
            [ "${workflow}" = ".github/workflows/build-native-android-apk.yml" ] && continue

            if grep -nE \
              'dependency:copy-dependencies|native-build/pom.xml|Install Maven|Create native dependency descriptor' \
              "${workflow}" \
              >/dev/null 2>&1; then

              echo "::error::Obsolete Maven/native-build workflow found: ${workflow}"
              found=1
            fi
          done < <(
            find .github/workflows \
              -type f \
              \( -name "*.yml" -o -name "*.yaml" \) \
              -print
          )

          if [ "${found}" -ne 0 ]; then
            echo "::error::Remove the obsolete Maven/native-build workflow(s) from .github/workflows."
            exit 1
          fi

          echo "No obsolete Maven/native-build workflow found."

      - name: Clean previous build outputs
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf native-build
          rm -rf app/build

      - name: Build Debug APK
        shell: bash
        run: |
          set -euxo pipefail

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          set -euxo pipefail

          echo "Generated APK files:"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          test -n "$(
            find app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              -print \
              -quit
          )"

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail

          APK="$(
            find app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              -print \
              -quit
          )"

          test -s "${APK}"

          echo "APK:"
          echo "${APK}"

          ls -lh "${APK}"

          APKSIGNER="${ANDROID_HOME}/build-tools/35.0.0/apksigner"

          if "${APKSIGNER}" verify --verbose "${APK}"; then
            echo "APK signature verification passed."
          else
            echo "::warning::APK signature verification was not successful."
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v5
        with:
          name: cropshare-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
