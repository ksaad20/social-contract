name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          validate-wrappers: false

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version

          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Verify AndroidManifest
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="app/src/main/AndroidManifest.xml"

          if grep -qE '<manifest[^>]*[[:space:]]package[[:space:]]*=' "${MANIFEST}"; then
            echo "::error::AndroidManifest.xml must not contain a package attribute with the current Android Gradle Plugin."
            echo "Define the namespace in app/build.gradle.kts instead."
            exit 1
          fi

          echo "AndroidManifest.xml is valid for the current Android Gradle Plugin."

      - name: Verify Android namespace and application ID
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE="app/build.gradle.kts"

          grep -Eq 'namespace[[:space:]]*=[[:space:]]*"com\.example\.socialcontract"' \
            "${BUILD_FILE}"

          grep -Eq 'applicationId[[:space:]]*=[[:space:]]*"com\.example\.socialcontract"' \
            "${BUILD_FILE}"

          echo "Namespace and applicationId verified."

      - name: Show production Kotlin sources
        shell: bash
        run: |
          set -euo pipefail

          echo "Production Kotlin sources:"

          find app/src/main \
            -type f \
            -name "*.kt" \
            ! -name "*Test.kt" \
            ! -name "*Test*.kt" \
            -print \
            | sort

      - name: Clean build
        shell: bash
        run: |
          set -euo pipefail

          gradle clean --no-daemon

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail

          echo "APK files:"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK="$(
            find app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              -print \
              -quit
          )"

          test -n "${APK}"
          test -s "${APK}"

          echo "APK_PATH=${APK}" >> "${GITHUB_ENV}"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$(
            find "${ANDROID_HOME}/build-tools" \
              -type f \
              -name "apksigner" \
              -print \
              | sort \
              | tail -n 1
          )"

          test -x "${APKSIGNER}"

          "${APKSIGNER}" verify \
            --verbose \
            "${APK_PATH}"

          ls -lh "${APK_PATH}"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v5
        with:
          name: debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
