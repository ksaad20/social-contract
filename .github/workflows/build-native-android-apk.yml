name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          validate-wrappers: false

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Project files:"
          find app/src/main -maxdepth 3 -type f | sort

      - name: Verify Kotlin sources
        shell: bash
        run: |
          set -euo pipefail

          test -n "$(find app/src/main -type f -name '*.kt' -print -quit)"

          echo "Production Kotlin sources:"
          find app/src/main \
            -type f \
            -name "*.kt" \
            ! -name "*Test.kt" \
            ! -name "*Test*.kt" \
            -print \
            | sort

      - name: Verify manifest namespace
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="app/src/main/AndroidManifest.xml"

          if grep -qE '<manifest[^>]*[[:space:]]package=' "${MANIFEST}"; then
            echo "::error::AndroidManifest.xml contains a package attribute."
            echo "The namespace must be defined in app/build.gradle.kts."
            exit 1
          fi

          echo "Manifest is compatible with modern Android Gradle Plugin."

      - name: Clean previous build
        shell: bash
        run: |
          set -euo pipefail

          gradle clean --no-daemon

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Generated APK files:"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          test -n "$(
            find app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              -print \
              -quit
          )"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              -print \
              -quit
          )"

          test -s "${APK}"

          echo "APK:"
          ls -lh "${APK}"

          SDK="${ANDROID_HOME}"
          APKSIGNER="$(
            find "${SDK}/build-tools" \
              -type f \
              -name apksigner \
              | sort \
              | tail -n 1
          )"

          test -x "${APKSIGNER}"

          "${APKSIGNER}" verify --verbose "${APK}"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v5
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
