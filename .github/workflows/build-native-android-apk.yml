name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build CropShare Debug APK
    runs-on: ubuntu-latest

    env:
      ANDROID_API: "35"
      BUILD_TOOLS: "35.0.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          sdkmanager "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

      - name: Remove obsolete manual build files
        shell: bash
        run: |
          set -euxo pipefail

          # The project must not use the previous Maven/manual APK builder.
          rm -rf native-build

          echo "Checking workflows for obsolete Maven/native-build references..."

          if grep -RniE \
            'dependency:copy-dependencies|cd native-build|native-build/pom.xml|mvn -B|Install Maven|Create native dependency descriptor' \
            .github/workflows \
            --exclude="$(basename "${GITHUB_WORKFLOW}")" 2>/dev/null; then

            echo "::error::An obsolete Maven/native-build workflow still exists."
            echo "::error::Delete that old workflow from .github/workflows."
            exit 1
          fi

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          validate-wrappers: false

      - name: Verify Gradle
        shell: bash
        run: |
          set -euxo pipefail

          gradle --version

      - name: Verify Android project
        shell: bash
        run: |
          set -euxo pipefail

          test -f settings.gradle.kts || \
          test -f settings.gradle

          test -f build.gradle.kts || \
          test -f build.gradle

          test -f app/build.gradle.kts || \
          test -f app/build.gradle

          test -f app/src/main/AndroidManifest.xml

          echo "Android project detected."

      - name: Verify Kotlin sources
        shell: bash
        run: |
          set -euxo pipefail

          find app/src/main \
            -type f \
            -name "*.kt" \
            -print

          test -n "$(
            find app/src/main \
              -type f \
              -name "*.kt" \
              -print \
              -quit
          )"

      - name: Verify namespace
        shell: bash
        run: |
          set -euxo pipefail

          BUILD_FILE=""

          if [ -f app/build.gradle.kts ]; then
            BUILD_FILE="app/build.gradle.kts"
          elif [ -f app/build.gradle ]; then
            BUILD_FILE="app/build.gradle"
          fi

          test -n "${BUILD_FILE}"

          echo "Using ${BUILD_FILE}"

          grep -n "namespace" "${BUILD_FILE}"

          if ! grep -Eq \
            'namespace[[:space:]]*=[[:space:]]*"com\.(example\.)?socialcontract(\.cropshare)?"' \
            "${BUILD_FILE}"; then

            echo "::error::Expected CropShare Android namespace was not found."
            exit 1
          fi

      - name: Verify manifest
        shell: bash
        run: |
          set -euxo pipefail

          MANIFEST="app/src/main/AndroidManifest.xml"

          echo "Manifest:"
          cat "${MANIFEST}"

          # Modern Android Gradle Plugin uses namespace from
          # app/build.gradle(.kts), not package= in AndroidManifest.xml.
          if grep -Eq \
            '<manifest[^>]*[[:space:]]package[[:space:]]*=' \
            "${MANIFEST}"; then

            echo "::error::AndroidManifest.xml contains package=."
            echo "::error::Remove package= from the manifest."
            echo "::error::Define namespace in app/build.gradle.kts instead."
            exit 1
          fi

      - name: Clean
        shell: bash
        run: |
          set -euxo pipefail

          gradle clean --no-daemon --stacktrace

      - name: Build Debug APK
        shell: bash
        run: |
          set -euxo pipefail

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          set -euxo pipefail

          echo "APK files generated:"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          test -s \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt"

          test -f "${APK}"
          test -s "${APK}"

          echo "APK size:"
          ls -lh "${APK}"

          echo
          echo "APK manifest/package information:"

          if [ -x "${AAPT}" ]; then
            "${AAPT}" dump badging "${APK}" | head -n 25
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v5
        with:
          name: cropshare-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
