name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          set -euo pipefail

          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          validate-wrappers: false

      - name: Verify project structure
        run: |
          set -euo pipefail

          echo "Project root:"
          pwd

          echo
          echo "Gradle files:"
          find . -maxdepth 3 \
            -type f \
            \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "gradle.properties" \
            \) \
            -print | sort

          echo
          echo "Kotlin sources:"
          find app/src/main \
            -type f \
            \( -name "*.kt" -o -name "*.kts" \) \
            -print | sort

          echo
          echo "Manifest:"
          test -f app/src/main/AndroidManifest.xml
          sed -n '1,160p' app/src/main/AndroidManifest.xml

      - name: Verify Android namespace
        run: |
          set -euo pipefail

          test -f app/build.gradle.kts || {
            echo "::error::app/build.gradle.kts was not found."
            exit 1
          }

          echo "Android namespace configuration:"
          grep -n "namespace" app/build.gradle.kts || true

          if ! grep -q 'namespace[[:space:]]*=' app/build.gradle.kts; then
            echo "::error::The Android namespace is missing from app/build.gradle.kts."
            echo "Add:"
            echo 'namespace = "com.example.socialcontract"'
            exit 1
          fi

      - name: Verify manifest has no package attribute
        run: |
          set -euo pipefail

          MANIFEST="app/src/main/AndroidManifest.xml"

          if grep -Eq '<manifest[^>]*[[:space:]]package[[:space:]]*=' "$MANIFEST"; then
            echo "::error::AndroidManifest.xml still contains a package attribute."
            echo "With modern Android Gradle Plugin, namespace belongs in app/build.gradle.kts."
            exit 1
          fi

          echo "Manifest package attribute check passed."

      - name: Verify Kotlin source layout
        run: |
          set -euo pipefail

          test -d app/src/main

          if ! find app/src/main \
            -type f \
            -name "*.kt" \
            -print \
            -quit | grep -q .; then
            echo "::error::No Kotlin source files were found under app/src/main."
            exit 1
          fi

          echo "Kotlin source files found:"
          find app/src/main \
            -type f \
            -name "*.kt" \
            -print | sort

      - name: Clean previous build
        run: |
          set -euo pipefail

          gradle clean --no-daemon

      - name: Build Debug APK
        run: |
          set -euo pipefail

          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        run: |
          set -euo pipefail

          echo "Generated APK files:"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          test -n "$(
            find app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              -print \
              -quit
          )"

      - name: Verify APK
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          test -s "$APK"

          echo "APK:"
          ls -lh "$APK"

          echo
          echo "APK metadata:"
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" \
            dump badging "$APK" | head -n 20

      - name: Upload Debug APK
        uses: actions/upload-artifact@v5
        with:
          name: cropshare-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
