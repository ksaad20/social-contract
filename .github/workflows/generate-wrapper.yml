name: Generate Gradle Wrapper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-wrapper:
    name: Generate Gradle 8.13 Wrapper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Gradle 8.13
        run: |
          curl -fL \
            -o /tmp/gradle-8.13-bin.zip \
            https://services.gradle.org/distributions/gradle-8.13-bin.zip

      - name: Extract Gradle 8.13
        run: |
          mkdir -p /tmp/gradle
          unzip -q /tmp/gradle-8.13-bin.zip -d /tmp/gradle

      - name: Generate Gradle Wrapper
        run: |
          /tmp/gradle/gradle-8.13/bin/gradle wrapper \
            --gradle-version 8.13

      - name: Verify Wrapper files
        run: |
          test -f gradlew
          test -f gradlew.bat
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

      - name: Show Wrapper checksum
        run: |
          sha256sum gradle/wrapper/gradle-wrapper.jar

      - name: Commit Wrapper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gradlew
          git add gradlew.bat
          git add gradle/wrapper/gradle-wrapper.jar
          git add gradle/wrapper/gradle-wrapper.properties

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add Gradle 8.13 Wrapper"
            git push
          fi
