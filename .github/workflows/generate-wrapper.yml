name: Generate Gradle 8.13 Wrapper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-wrapper:
    name: Generate and commit Gradle Wrapper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Remove existing Wrapper JAR
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar

      - name: Generate Gradle 8.13 Wrapper
        run: |
          gradle wrapper --gradle-version 8.13

      - name: Verify Wrapper files
        run: |
          test -f gradlew
          test -f gradlew.bat
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

      - name: Verify Wrapper JAR checksum
        run: |
          sha256sum gradle/wrapper/gradle-wrapper.jar

      - name: Verify Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Commit official Wrapper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gradlew
          git add gradlew.bat
          git add gradle/wrapper/gradle-wrapper.jar
          git add gradle/wrapper/gradle-wrapper.properties

          if git diff --cached --quiet; then
            echo "No Wrapper changes to commit."
            exit 0
          fi

          git commit -m "Regenerate Gradle 8.13 Wrapper"
          git push
